# Docker Compose Production-Datei
# Zweck:
# - definiert den produktionsnahen Stack
# - startet Webserver + Redis
# - nutzt ein persistentes Docker Volume für Redis-Daten
# - nutzt ein lokales Docker-Compose-Secret für das Redis-Passwort
# - prüft per Health Check, ob die Dienste wirklich funktionieren
# - begrenzt Container-Logs per Log Rotation
# - ergänzt eine erste Container-Härtung gegen Privilegien-Eskalation

services:
  # Web-Service:
  # Das ist dein Nginx-Webcontainer mit deiner HTML-Seite.
  web:
    # Docker baut das Image aus deinem lokalen Projektordner.
    build:
      # Der aktuelle Projektordner ist der Build-Kontext.
      context: .

      # Docker nutzt die Datei "Dockerfile" als Bauanleitung.
      dockerfile: Dockerfile

    # Name und Version des gebauten Images.
    # Versionen sind später wichtig für Rollbacks.
    image: handsonlabs/my-web:v1.2

    # Portweiterleitung:
    # Host-Port 8082 auf deinem PC -> Container-Port 80 im Webcontainer.
    ports:
      - "8082:80"

    # Docker startet den Container nach Absturz oder Docker-Neustart erneut,
    # außer du hast ihn bewusst gestoppt.
    restart: unless-stopped

    # Erste Container-Härtung:
    # Verhindert, dass Prozesse im Container neue zusätzliche Privilegien erhalten.
    security_opt:
      - no-new-privileges:true

    # Log Rotation:
    # Docker begrenzt die Logdateien dieses Containers.
    # Ohne Begrenzung können Container-Logs dauerhaft wachsen und Speicherplatz füllen.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Start-Abhängigkeit:
    # web soll erst starten, wenn redis als healthy gilt.
    depends_on:
      redis:
        condition: service_healthy

    # Technischer Healthcheck für den Webcontainer.
    # Er prüft nur, ob Nginx lokal im Container antwortet.
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1
      interval: 30s
      timeout: 3s
      retries: 3

  # Redis-Service:
  # Redis speichert in diesem Lab persistente Übungsdaten.
  redis:
    # Redis-Image.
    image: redis:alpine

    # Redis bekommt Zugriff auf das Secret "redis_password".
    # Das Secret wird im Container als Datei unter /run/secrets/redis_password bereitgestellt.
    secrets:
      - redis_password

    # Startbefehl für Redis.
    # Wichtig:
    # - sh -c erlaubt uns, das Passwort aus der Secret-Datei zu lesen.
    # - exec ersetzt den Shell-Prozess durch redis-server.
    # - $$ verhindert, dass Docker Compose den Ausdruck schon auf dem Host interpoliert.
    # SECURITY:
    # Das Passwort steht dadurch nicht mehr direkt als Wert in compose.prod.yml.
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"

    # Persistentes Docker Volume für Redis-Daten.
    volumes:
      - redis_data_prod:/data

    # Redis wird nach Absturz oder Docker-Neustart automatisch wieder gestartet,
    # außer er wurde bewusst gestoppt.
    restart: unless-stopped

    # Erste Container-Härtung:
    # Verhindert, dass Prozesse im Container neue zusätzliche Privilegien erhalten.
    security_opt:
      - no-new-privileges:true

    # Log Rotation:
    # Redis kann im Betrieb regelmäßig Logs schreiben.
    # Die Begrenzung verhindert, dass lokale Container-Logs unkontrolliert wachsen.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Redis-Healthcheck.
    # REDISCLI_AUTH liest das Passwort aus der Secret-Datei.
    # Die Block-Schreibweise vermeidet YAML-Parsing-Probleme durch verschachtelte Anführungszeichen.
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

# Docker Compose Secret:
# Das Secret kommt aus einer lokalen Datei.
# Diese Datei wird NICHT committed und wird durch .gitignore geschützt.
secrets:
  redis_password:
    file: ./secrets/redis_password.txt

# Benanntes Docker Volume:
# Compose erzeugt daraus im aktuellen Projekt:
# dockerbung_redis_data_prod
volumes:
  redis_data_prod:
