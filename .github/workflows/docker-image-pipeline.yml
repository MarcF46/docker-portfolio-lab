name: Docker Image Pipeline

on:
  push:
    branches:
      - main
  pull_request:

env:
  IMAGE_NAME: handsonlabs/my-web
  IMAGE_TAG: ci

jobs:
  build-test-scan-image:
    name: Build, test and optionally scan Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Docker-Versionen anzeigen
        run: |
          docker version
          docker compose version

      - name: Docker Buildx vorbereiten
        uses: docker/setup-buildx-action@v4

      - name: Image bauen und lokal laden
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          pull: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Image lokal anzeigen
        run: |
          docker image ls ${{ env.IMAGE_NAME }}

      - name: Testcontainer starten
        run: |
          docker run --rm -d --name web-ci-test -p 8088:80 ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Webserver im Testcontainer prüfen
        run: |
          sleep 5
          curl --fail --show-error --silent --head http://localhost:8088

      - name: Healthcheck-Werkzeug prüfen
        run: |
          docker exec web-ci-test sh -c 'which wget'

      - name: Containerstatus prüfen
        run: |
          docker ps --filter name=web-ci-test

      - name: Docker Scout ausführen, wenn Docker-Hub-Secrets vorhanden sind
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/scout-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          command: cves,recommendations
          image: local://${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          summary: true
          write-comment: false

      - name: Docker Scout Hinweis ohne Secrets
        if: ${{ env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Docker Scout wurde in dieser Pipeline uebersprungen."
          echo "Grund: DOCKERHUB_USERNAME oder DOCKERHUB_TOKEN ist nicht als GitHub Secret gesetzt."
          echo "Der lokale Image-Scan wurde im Projekt bereits mit Docker Scout dokumentiert."
          echo "Spaeter kann dieser Schritt aktiviert werden, wenn Docker-Hub-Secrets sauber eingerichtet sind."

      - name: Logs bei Fehler anzeigen
        if: failure()
        run: |
          docker ps -a
          docker logs web-ci-test || true

      - name: Testcontainer entfernen
        if: always()
        run: |
          docker stop web-ci-test || true
