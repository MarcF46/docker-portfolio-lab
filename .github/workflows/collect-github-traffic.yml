name: Collect GitHub traffic

on:
  workflow_dispatch:

  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  collect-traffic:
    name: Archive repository traffic snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect GitHub traffic data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          python scripts/collect_github_traffic.py

      - name: Commit archived traffic data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain analytics/github-traffic)" ]]; then
            git add analytics/github-traffic
            git commit -m "Archive GitHub traffic snapshot"
            git push
          else
            echo "No traffic data changes to commit."
          fi
